[package]
name = "mobaus-studio"
version = "0.1.0"
description = "MobausStudio AI Client Tool"
authors = ["MobausStudio Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mobaus_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"  # v2.6.2: 文件保存对话框支持
tauri-plugin-fs = "2"      # v2.6.2: 文件系统写入支持
tauri-plugin-updater = "2" # 软件自动更新支持
tauri-plugin-process = "2" # 进程管理（重启应用）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
# MCP 需要完整的 tokio 功能：进程管理、异步 IO、同步原语、定时器
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
# MCP 协议支持
async-trait = "0.1"        # 异步 trait 支持
once_cell = "1.19"         # 全局单例
glob = "0.3"               # 路径通配符展开（用于查找 nvm 安装的 Node.js）
urlencoding = "2.1"        # URL 编码（v3.0.6: skills.sh 搜索参数编码）
url = "2.5"                # URL 解析（v4.2.5: SSRF 防护）
base64 = "0.22.1"
getrandom = "0.2"          # 安全随机数生成（v0.7.2: Kiro PKCE）
sha2 = "0.10"              # SHA256 哈希（v0.7.2: Kiro PKCE code_challenge）
chrono = "0.4"             # 时间处理（v0.8.0: Kiro API 时间戳）
flate2 = "1.0"             # gzip 压缩/解压缩（v0.9.2.8: Claude API 错误响应解压）
tar = "0.4"                # tarball 解包（skills 离线扫描）
# config-switcher: 配置导出模块
thiserror = "1"            # 错误类型派生宏
toml_edit = "0.22"         # TOML 序列化（保留格式的 TOML 编辑）
dirs = "5"                 # 跨平台用户目录获取
notify = "6"               # 文件系统监听（配置文件变化检测）

# v2.7.0: Unix 信号处理（用于 MCP 进程优雅停止）
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Linux: libc 用于 prctl 设置子进程在父进程退出时自动终止
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"


[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serial_test = "3"  # 串行测试支持（避免集成测试环境变量竞争）
