# CI 测试配置
# 触发方式：推送到 main 分支或 PR
#
# 检查项：
# - TypeScript 编译检查
# - 单元测试
# - 代码风格检查（可选）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 编译检查
        run: npx tsc --noEmit

      - name: ESLint 代码质量检查
        run: npm run lint

      - name: 运行单元测试
        run: npm test

      - name: 构建检查
        run: npm run build

  # 可选：Rust 编译检查（Tauri 后端）
  rust-check:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Rust 编译检查
        run: |
          cd src-tauri
          cargo check

      - name: Rust 代码格式检查
        run: |
          cd src-tauri
          cargo fmt --check

      - name: Rust Clippy 检查
        run: |
          cd src-tauri
          cargo clippy -- -D warnings

      - name: Rust 单元测试
        run: |
          cd src-tauri
          cargo test
