# CI 测试配置
# 触发方式：推送到 main 分支或 PR
#
# 检查项：
# - TypeScript 编译检查
# - 单元测试
# - 代码风格检查（可选）
# - Docker Web 镜像构建烟测
# - macOS 本地 App 包构建烟测
# - RustSec 漏洞审计

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 前端依赖漏洞审计
        run: npm run audit:web

      - name: TypeScript 编译检查
        run: npx tsc --noEmit

      - name: ESLint 代码质量检查
        run: npm run lint

      - name: 发布版本门禁测试
        run: npm run test:release-version

      - name: Release Workflow 结构门禁
        run: npm run verify:release-workflow

      - name: Release Workflow 结构门禁测试
        run: npm run test:release-workflow

      - name: Release 资产完整性门禁测试
        run: npm run test:release-assets

      - name: Updater Manifest 门禁测试
        run: npm run test:updater-manifest

      - name: Tauri 安全配置门禁
        run: |
          npm run verify:tauri-security
          npm run test:tauri-security

      - name: 运行单元测试
        run: npm test

      - name: 构建检查
        run: npm run build

  docker-web-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建 Docker Web 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mobaus-studio-web-ci:${{ github.sha }}
          build-args: |
            APP_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证 Docker 镜像版本元数据
        run: |
          VERSION="$(docker image inspect mobaus-studio-web-ci:${GITHUB_SHA} --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "$VERSION" = "0.0.0-ci"

  web-production-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 生产 Web 预览浏览器烟测
        env:
          PRODUCTION_SMOKE_SCREENSHOT: artifacts/production-smoke/mobausstudio-production-smoke.png
          PRODUCTION_SMOKE_REPORT: artifacts/production-smoke/report.json
        run: npm run smoke:web:production

      - name: 上传生产 Web 烟测证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-web-smoke-${{ github.sha }}
          path: artifacts/production-smoke
          if-no-files-found: warn

  macos-app-local-build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: npm ci

      - name: 构建 macOS 本地 App 包
        run: npm run build:app:local

      - name: 验证 macOS App Bundle 结构
        run: npm run verify:macos-app-bundle

      - name: macOS App LaunchServices 启动烟测
        run: npm run smoke:macos-app-launch

  # 可选：Rust 编译检查（Tauri 后端）
  rust-check:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec 漏洞审计
        run: |
          cd src-tauri
          cargo audit

      - name: Rust 编译检查
        run: |
          cd src-tauri
          cargo check

      - name: Rust 代码格式检查
        run: |
          cd src-tauri
          cargo fmt --check

      - name: Rust Clippy 检查
        run: |
          cd src-tauri
          cargo clippy -- -D warnings

      - name: Rust 单元测试
        run: |
          cd src-tauri
          cargo test
